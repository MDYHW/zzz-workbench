<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZZZ Setup Companion</title>
<link rel="stylesheet" href="popup.css">
<main>
  <header>
    <p class="eyebrow">ZZZ Setup Companion · 0.4.2 · 한국어 / EN</p>
    <h1>파티 세팅 가져오기</h1>
    <p id="party" class="scope">사이트에서 선택한 파티와 주력을 사용합니다.</p>
  </header>
  <div class="party-input">
    <label for="shortcut">사이트의 Copy Setting URL</label>
    <input id="shortcut" type="url" maxlength="17000" autocomplete="off" spellcheck="false" placeholder="https://zzz-setup-workbench.github.io/#setup=…">
  </div>
  <div class="actions">
    <button id="collect" type="button" disabled>파티 3명 장비 읽기</button>
    <button id="open" type="button" disabled>Workbench에서 열기</button>
  </div>
  <p id="status" role="status" aria-live="polite">URL을 넣은 뒤 HoYoLAB 전적에서 실행하세요.</p>
  <section id="result" hidden>
    <h2 id="summary">수집 결과</h2>
    <div id="members"></div>
    <details id="raw" hidden>
      <summary>문제 해결용 데이터 보기</summary>
      <label for="output">수집 데이터 또는 열지 못한 주소</label>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </details>
  </section>
  <p class="footnote">전체 엔진 후보 · 육성 완료 기준. 로그인 정보 수집이나 장비 데이터 서버 전송은 없습니다.</p>
</main>
<script type="module" src="popup.js"></script>
</html>
