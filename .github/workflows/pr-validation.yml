name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  behavior-tests:
    name: Behavior Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Determine documentation-only verification scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/governance/documentation-check-scope.mjs
      - name: Behavior tests not applicable
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE == 'true' }}
        run: |
          npm ci --ignore-scripts
          npm run check:repo
          echo 'Behavior tests not applicable; repository and Rule ID validation passed for regular documentation changes.' >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci --ignore-scripts
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE != 'true' }}
      - run: npm run test:governance
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE != 'true' }}
      - run: npm test
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE != 'true' }}

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Determine documentation-only verification scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/governance/documentation-check-scope.mjs
      - name: Type check not applicable
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE == 'true' }}
        run: echo 'Type check not applicable for regular documentation changes.' >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci --ignore-scripts
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE != 'true' }}
      - run: npm exec -- tsc -b
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE != 'true' }}

  production-build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Determine documentation-only verification scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/governance/documentation-check-scope.mjs
      - name: Production build not applicable
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE == 'true' }}
        run: echo 'Production build not applicable for regular documentation changes.' >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci --ignore-scripts
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE != 'true' }}
      - run: npm exec -- vite build
        if: ${{ env.DOCUMENTATION_CHECKS_NOT_APPLICABLE != 'true' }}
