<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yixuan Identity Posters - Round 02</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Mono", monospace;
        background: #0b0c0d;
        color: #f2efe4;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 0;
        margin: 0;
      }

      body {
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          #0b0c0d;
        background-size: 32px 32px;
      }

      .page {
        width: min(1500px, 100%);
        margin: 0 auto;
        padding: 44px clamp(16px, 4vw, 64px) 72px;
      }

      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 28px;
        margin-bottom: 30px;
        border-bottom: 1px solid #393c3f;
        padding-bottom: 18px;
      }

      .intro h1 {
        margin: 0;
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(50px, 8vw, 106px);
        font-weight: 400;
        line-height: 0.82;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }

      .intro p {
        max-width: 46ch;
        margin: 0;
        color: #aeb2b4;
        font-size: 11px;
        line-height: 1.65;
        text-align: right;
        text-transform: uppercase;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(24px, 3vw, 42px);
      }

      figure {
        min-width: 0;
        margin: 0;
      }

      figure:last-child {
        grid-column: 1 / -1;
        width: calc(50% - clamp(12px, 1.5vw, 21px));
        justify-self: center;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding-top: 9px;
        color: #979b9d;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      figcaption b {
        color: #f2efe4;
        font-weight: 500;
      }

      .poster {
        position: relative;
        isolation: isolate;
        width: 100%;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        opacity: 0;
        transform: translateY(10px);
        animation: arrive 480ms ease forwards;
      }

      figure:nth-child(2) .poster {
        animation-delay: 70ms;
      }

      figure:nth-child(3) .poster {
        animation-delay: 140ms;
      }

      figure:nth-child(4) .poster {
        animation-delay: 210ms;
      }

      figure:nth-child(5) .poster {
        animation-delay: 280ms;
      }

      .poster img {
        position: absolute;
        display: block;
        pointer-events: none;
        user-select: none;
        transition: transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .poster:hover img {
        transform: translate3d(0, -1.5%, 0) scale(1.025);
      }

      .display {
        font-family: "Bebas Neue", sans-serif;
        font-weight: 400;
        line-height: 0.8;
        letter-spacing: -0.025em;
        text-transform: uppercase;
      }

      .micro {
        font-size: clamp(7px, 0.82vw, 10px);
        line-height: 1.35;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .fact-label {
        display: block;
        margin-bottom: 2px;
        opacity: 0.7;
        font-size: 0.78em;
      }

      .fact-value {
        display: block;
        font-weight: 500;
      }

      .print-noise {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        background:
          repeating-linear-gradient(
            0deg,
            transparent 0 3px,
            rgba(0, 0, 0, 0.055) 3px 4px
          ),
          radial-gradient(circle, rgba(0, 0, 0, 0.14) 0 0.65px, transparent 0.8px);
        background-size: auto, 5px 5px;
        mix-blend-mode: multiply;
      }

      /* 01: broadsheet slash */
      .v01 {
        color: #201916;
        background: #ead4ac;
      }

      .v01::before {
        content: "";
        position: absolute;
        inset: -14% 36% -18% 49%;
        z-index: 1;
        background: #a5101d;
        transform: skewX(-15deg);
      }

      .v01::after {
        content: "";
        position: absolute;
        left: 4%;
        right: 4%;
        top: 8%;
        height: 2px;
        z-index: 6;
        background: #201916;
        box-shadow: 0 6px 0 rgba(32, 25, 22, 0.45);
      }

      .v01 img {
        right: -5%;
        bottom: -63%;
        z-index: 3;
        width: 70%;
        height: 168%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.28);
        mix-blend-mode: multiply;
      }

      .v01 .kicker {
        position: absolute;
        top: 12%;
        left: 5%;
        z-index: 6;
        width: 38%;
      }

      .v01 .name {
        position: absolute;
        left: 4%;
        top: 28%;
        z-index: 6;
        color: #a5101d;
        font-size: clamp(72px, 10vw, 138px);
      }

      .v01 .rank {
        position: absolute;
        top: 14%;
        right: 4%;
        z-index: 7;
        border: 4px solid #ead4ac;
        padding: 5px 9px 3px;
        color: #ead4ac;
        font-size: clamp(34px, 5vw, 64px);
        transform: rotate(5deg);
      }

      .v01 .facts {
        position: absolute;
        left: 5%;
        right: 5%;
        bottom: 7%;
        z-index: 7;
        display: flex;
        gap: 8px;
        align-items: end;
      }

      .v01 .fact {
        min-width: 31%;
        border-left: 7px solid #a5101d;
        padding: 5px 8px;
        background: rgba(234, 212, 172, 0.92);
      }

      /* 02: caution splice */
      .v02 {
        color: #eee5d7;
        background: #12100f;
      }

      .v02::before {
        content: "";
        position: absolute;
        left: -8%;
        right: -8%;
        top: 43%;
        height: 23%;
        z-index: 4;
        background: #ff581f;
        transform: rotate(-7deg);
      }

      .v02::after {
        content: "NEW ERIDU / IDENTITY CHANNEL / 13";
        position: absolute;
        left: -3%;
        right: -3%;
        top: 48%;
        z-index: 7;
        color: #12100f;
        font-size: clamp(8px, 1vw, 12px);
        letter-spacing: 0.22em;
        text-align: center;
        transform: rotate(-7deg);
      }

      .v02 img {
        right: -8%;
        bottom: -64%;
        z-index: 3;
        width: 72%;
        height: 172%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.38);
      }

      .v02 .name {
        position: absolute;
        left: 4%;
        top: 12%;
        z-index: 6;
        width: 50%;
        font-size: clamp(78px, 11.5vw, 154px);
      }

      .v02 .rank {
        position: absolute;
        right: 4%;
        top: 7%;
        z-index: 7;
        border: 2px solid #ff581f;
        padding: 5px 8px;
        color: #ff581f;
        transform: rotate(-4deg);
      }

      .v02 .facts {
        position: absolute;
        left: 5%;
        bottom: 6%;
        z-index: 7;
        display: flex;
        gap: 10px;
      }

      .v02 .fact {
        min-width: 130px;
        padding: 6px 10px;
        color: #12100f;
        background: #eee5d7;
        clip-path: polygon(0 0, 100% 0, 93% 100%, 0 100%);
      }

      /* 03: record collision */
      .v03 {
        color: #18131f;
        background: #c8b5f5;
      }

      .v03::before {
        content: "";
        position: absolute;
        right: -8%;
        top: -37%;
        width: 78%;
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(
            circle,
            #ff6545 0 8%,
            #18131f 8% 10%,
            #c8b5f5 10% 11%,
            #18131f 11% 50%,
            #ff6545 50% 51%,
            #18131f 51%
          );
      }

      .v03::after {
        content: "";
        position: absolute;
        left: -6%;
        bottom: -13%;
        z-index: 4;
        width: 112%;
        height: 24%;
        background: #ff6545;
        transform: rotate(-4deg);
      }

      .v03 img {
        right: 4%;
        bottom: -70%;
        z-index: 3;
        width: 61%;
        height: 178%;
        object-fit: contain;
      }

      .v03 .serial {
        position: absolute;
        top: 8%;
        left: 5%;
        z-index: 6;
        width: 34%;
      }

      .v03 .name {
        position: absolute;
        left: 3%;
        bottom: 9%;
        z-index: 7;
        color: #c8b5f5;
        font-size: clamp(72px, 10.5vw, 144px);
        text-shadow: 3px 3px 0 #18131f;
        transform: rotate(-4deg);
      }

      .v03 .rank {
        position: absolute;
        top: 11%;
        right: 6%;
        z-index: 7;
        width: clamp(58px, 8vw, 90px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #c8b5f5;
        background: #ff6545;
        font-size: clamp(13px, 1.6vw, 19px);
        transform: rotate(8deg);
      }

      .v03 .facts {
        position: absolute;
        left: 5%;
        top: 32%;
        z-index: 6;
        display: grid;
        gap: 7px;
      }

      .v03 .fact {
        width: max-content;
        max-width: 190px;
        border-left: 6px solid #ff6545;
        padding: 4px 8px;
        background: rgba(200, 181, 245, 0.9);
      }

      /* 04: street bill layers */
      .v04 {
        color: #10100e;
        background: #f0e8d7;
      }

      .v04::before {
        content: "";
        position: absolute;
        inset: -12% 48% -10% -13%;
        z-index: 1;
        background: #e3f21e;
        transform: rotate(4deg);
        clip-path: polygon(4% 0, 100% 3%, 94% 89%, 2% 100%);
      }

      .v04::after {
        content: "";
        position: absolute;
        inset: 11% -5% 8% 27%;
        z-index: 2;
        background: #10100e;
        transform: rotate(-2deg);
        clip-path: polygon(3% 4%, 96% 0, 100% 91%, 7% 100%);
      }

      .v04 img {
        right: -5%;
        bottom: -72%;
        z-index: 3;
        width: 70%;
        height: 185%;
        object-fit: contain;
      }

      .v04 .name {
        position: absolute;
        left: 4%;
        bottom: 7%;
        z-index: 7;
        color: #10100e;
        font-size: clamp(80px, 11vw, 148px);
        transform: rotate(4deg);
      }

      .v04 .rank {
        position: absolute;
        top: 8%;
        left: 5%;
        z-index: 7;
        border: 4px solid #10100e;
        padding: 5px 8px 3px;
        font-size: clamp(30px, 4.6vw, 58px);
        transform: rotate(-8deg);
      }

      .v04 .facts {
        position: absolute;
        right: 4%;
        top: 8%;
        z-index: 7;
        width: 34%;
        display: grid;
        gap: 8px;
        color: #10100e;
      }

      .v04 .fact {
        padding: 6px 10px;
        background: #e3f21e;
        clip-path: polygon(0 0, 100% 3%, 95% 100%, 3% 96%);
      }

      .v04 .fact:nth-child(1) {
        transform: rotate(-3deg);
      }

      .v04 .fact:nth-child(2) {
        transform: translateX(-12px) rotate(2deg);
      }

      .v04 .fact:nth-child(3) {
        transform: translateX(5px) rotate(-1deg);
      }

      .v04 .tape {
        position: absolute;
        left: 37%;
        top: 2%;
        z-index: 6;
        width: 26%;
        height: 9%;
        background: rgba(240, 232, 215, 0.72);
        transform: rotate(-5deg);
      }

      /* 05: tabloid fold */
      .v05 {
        color: #f0eadf;
        background: #8e1521;
      }

      .v05::before {
        content: "";
        position: absolute;
        left: -8%;
        top: -11%;
        z-index: 1;
        width: 65%;
        height: 122%;
        background:
          radial-gradient(circle, rgba(20, 17, 16, 0.16) 0 0.7px, transparent 0.9px),
          #f0d8ad;
        background-size: 5px 5px;
        transform: rotate(-6deg);
      }

      .v05::after {
        content: "";
        position: absolute;
        right: -15%;
        bottom: -30%;
        z-index: 2;
        width: 70%;
        aspect-ratio: 1;
        border: 48px solid #1b1721;
        border-radius: 50%;
      }

      .v05 img {
        left: 34%;
        bottom: -72%;
        z-index: 3;
        width: 62%;
        height: 184%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.22);
        mix-blend-mode: multiply;
      }

      .v05 .name {
        position: absolute;
        left: 3%;
        right: 3%;
        top: 36%;
        z-index: 6;
        color: #f0eadf;
        font-size: clamp(74px, 11vw, 148px);
        text-align: center;
        text-shadow: 4px 4px 0 #1b1721;
        transform: rotate(-3deg);
      }

      .v05 .rank {
        position: absolute;
        left: 5%;
        top: 8%;
        z-index: 7;
        padding: 7px 10px 5px;
        color: #f0eadf;
        background: #1b1721;
        font-size: clamp(21px, 3vw, 38px);
        transform: rotate(5deg);
      }

      .v05 .facts {
        position: absolute;
        right: 4%;
        top: 7%;
        z-index: 7;
        display: flex;
        gap: 6px;
        align-items: start;
      }

      .v05 .fact {
        min-width: 118px;
        border-bottom: 5px solid #1b1721;
        padding: 5px 7px;
        color: #1b1721;
        background: #f0d8ad;
        transform: rotate(-2deg);
      }

      .v05 .fold {
        position: absolute;
        left: 23%;
        top: -8%;
        z-index: 5;
        width: 10%;
        height: 118%;
        background: rgba(27, 23, 33, 0.12);
        transform: rotate(-6deg);
      }

      @keyframes arrive {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 820px) {
        .intro {
          display: grid;
        }

        .intro p {
          text-align: left;
        }

        .gallery {
          grid-template-columns: 1fr;
        }

        figure:last-child {
          grid-column: auto;
          width: 100%;
        }
      }

      @media (max-width: 460px) {
        .page {
          padding-top: 26px;
        }

        .v01 .facts,
        .v02 .facts,
        .v05 .facts {
          gap: 4px;
        }

        .v01 .fact,
        .v02 .fact,
        .v05 .fact {
          min-width: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .poster {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .poster img {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Identity poster<br />round 02</h1>
        <p>
          Five wide compositions. Same Agent, artwork, rank, Attribute, and
          Specialty. Only the poster structure changes.
        </p>
      </header>

      <section class="gallery" aria-label="Five Yixuan identity poster variants">
        <figure>
          <article class="poster v01" aria-label="Variant 1, broadsheet slash">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="kicker micro">New Eridu broadsheet<br />Agent file 013</div>
            <div class="name display">Yixuan</div>
            <div class="rank display">S</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Rank</span>
                <span class="fact-value">S-Rank</span>
              </div>
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
            <div class="print-noise"></div>
          </article>
          <figcaption><b>01 Broadsheet slash</b><span>Print field / diagonal cut</span></figcaption>
        </figure>

        <figure>
          <article class="poster v02" aria-label="Variant 2, caution splice">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="name display">Yi<br />xuan</div>
            <div class="rank micro">S-Rank</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
          </article>
          <figcaption><b>02 Caution splice</b><span>Warning band / collision</span></figcaption>
        </figure>

        <figure>
          <article class="poster v03" aria-label="Variant 3, record collision">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="serial micro">New Eridu archives<br />Side A / Agent 013</div>
            <div class="name display">Yixuan</div>
            <div class="rank micro">S-Rank</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
          </article>
          <figcaption><b>03 Record collision</b><span>Sleeve / circular pressure</span></figcaption>
        </figure>

        <figure>
          <article class="poster v04" aria-label="Variant 4, street bill layers">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="tape"></div>
            <div class="name display">Yixuan</div>
            <div class="rank display">S</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Rank</span>
                <span class="fact-value">S-Rank</span>
              </div>
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
          </article>
          <figcaption><b>04 Street bill</b><span>Paper layers / tape</span></figcaption>
        </figure>

        <figure>
          <article class="poster v05" aria-label="Variant 5, tabloid fold">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="fold"></div>
            <div class="name display">Yixuan</div>
            <div class="rank display">S</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Rank</span>
                <span class="fact-value">S-Rank</span>
              </div>
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
            <div class="print-noise"></div>
          </article>
          <figcaption><b>05 Tabloid fold</b><span>Fold seam / type bridge</span></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
