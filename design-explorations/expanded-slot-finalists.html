<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expanded slot / five finalists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="expanded-slot-finalists-base.css">
  <link rel="stylesheet" href="expanded-slot-finalists-abc.css">
  <link rel="stylesheet" href="expanded-slot-finalists-de.css">
  <style>
    .identity-inner, .setup-inner, .result-inner { position: relative; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Expanded<br>slot / 05</h1>
      <p>Same semantic content. Five different hypotheses for media, topology, boundaries, density and colour distribution.</p>
    </header>
    <div class="finalist-list" id="finalist-list"></div>
  </main>

  <template id="identity-template">
    <div class="identity-inner">
      <img class="art art-full" src="assets/yixuan-portrait.png" alt="Yixuan">
      <img class="art art-alt" src="assets/yixuan-trails-portrait.png" alt="Yixuan">
      <img class="art art-card" src="assets/yixuan-mechanics-01.jpg" alt="Yixuan">
      <h3 class="identity-name">Yixuan</h3>
      <span class="focus">Focus / Slot 01</span>
      <div class="symbol-strip" aria-label="S-Rank, Auric Ink, Rupture">
        <div class="symbol"><img src="assets/zzz-rank-s.png" alt=""><span><small>Rank</small>S-Rank</span></div>
        <div class="symbol"><img src="assets/zzz-attribute-auric-ink.png" alt=""><span><small>Attribute</small>Auric Ink</span></div>
        <div class="symbol"><img src="assets/zzz-specialty-rupture.png" alt=""><span><small>Specialty</small>Rupture</span></div>
      </div>
    </div>
  </template>

  <template id="setup-template">
    <div class="setup-inner">
      <header class="section-label"><div><span>Prepared inputs</span><h3>Setup</h3></div><b>EDITABLE</b></header>
      <ol class="choices">
        <li class="choice"><span class="choice-index">01 / State</span><span class="choice-copy"><strong>Mindscape M0</strong><small>Lv.60 ? Core max</small></span><span class="choice-mark">?</span></li>
        <li class="choice"><span class="choice-index">02 / Pool</span><span class="choice-copy"><strong>Full W-Engine pool</strong><small>Limited + standard</small></span><span class="choice-mark">?</span></li>
        <li class="choice"><span class="choice-index">03 / Engine</span><span class="choice-copy"><strong>Qingming Birdcage</strong><small>W1 ? Rank default</small></span><span class="choice-mark">?</span></li>
        <li class="choice"><span class="choice-index">04 / Discs</span><span class="choice-copy"><strong>Yunkui Tales 4</strong><small>Woodpecker Electro 2</small></span><span class="choice-mark">?</span></li>
      </ol>
      <div class="mains">
        <span>D4<b>CRIT Rate</b></span><span>D5<b>Ether DMG</b></span><span>D6<b>HP</b></span>
      </div>
      <div class="subs">
        <span>CRIT Rate<b>3</b></span><span>CRIT DMG<b>3</b></span><span>HP<b>4</b></span><span>ATK<b>2</b></span>
      </div>
    </div>
  </template>

  <template id="result-template">
    <div class="result-inner">
      <header class="section-label"><div><span>Current setup</span><h3>Result</h3></div><b>LIVE</b></header>
      <div class="surface-row"><span>Important value</span><span>Initial</span><span>Combat</span><span>Fully enabled</span></div>
      <table class="metrics" aria-label="Yixuan Result values">
        <tbody>
          <tr><th>Max HP</th><td>16,890</td><td>16,890</td><td>19,340</td></tr>
          <tr><th>Sheer Force</th><td>2,104</td><td>2,104</td><td>2,432</td></tr>
          <tr><th>CRIT Rate</th><td>58.6%</td><td>78.6%</td><td>83.4%</td></tr>
          <tr><th>CRIT DMG</th><td>64.4%</td><td>64.4%</td><td>154.4%</td></tr>
        </tbody>
      </table>
      <div class="gauge">
        <div class="gauge-labels"><span>Fully enabled CRIT Rate</span><span>83.4 / 100%</span></div>
        <div class="gauge-track"><span class="gauge-fill"></span><i class="gauge-cap"></i></div>
      </div>
      <div class="actions">
        <span>Material action difference</span>
        <div class="action-values"><span>Basic Attack<b>+58</b></span><span>EX Special<b>+78</b></span><span>Ultimate<b>+78</b></span></div>
      </div>
    </div>
  </template>

  <script>
    const finalists = [
      { n: '01', cls: 'bleed', title: 'Ink bleed', note: 'Face poster / offset setup sheet / Result emerges beneath' },
      { n: '02', cls: 'corridor', title: 'Signal corridor', note: 'Standing art / connected setup rail / expression decays rightward' },
      { n: '03', cls: 'canvas', title: 'Result canvas', note: 'Result is the field / identity seal and setup insert overlap it' },
      { n: '04', cls: 'stage', title: 'Folded stage', note: 'Standing anchor / horizontal setup relay / Result continues below' },
      { n: '05', cls: 'breach', title: 'Step breach', note: 'Face field / setup steps cross the boundary into Result' }
    ];

    const clone = id => document.getElementById(id).content.cloneNode(true);
    const compact = (agent, index, mark) => {
      const node = document.createElement('aside');
      node.className = 'compact compact-' + agent.toLowerCase();
      node.dataset.mark = mark;
      node.innerHTML = `<span class="compact-index">0${index}</span><div class="compact-copy"><h3>${agent}</h3><p>Party slot<br>select to expand</p></div>`;
      return node;
    };

    const list = document.getElementById('finalist-list');
    finalists.forEach(item => {
      const section = document.createElement('section');
      section.className = 'finalist';
      section.innerHTML = `<header class="finalist-heading"><h2>${item.n} / ${item.title}</h2><p>${item.note}</p></header>`;
      const windowNode = document.createElement('div');
      windowNode.className = 'rail-window';
      const row = document.createElement('div');
      row.className = `party-row ${item.cls}-row`;
      const expanded = document.createElement('article');
      expanded.className = `expanded ${item.cls}`;
      [['identity', 'identity-template'], ['setup', 'setup-template'], ['result', 'result-template']].forEach(([cls, id]) => {
        const region = document.createElement('section');
        region.className = cls;
        region.dataset.fragment = cls;
        region.append(clone(id));
        expanded.append(region);
      });
      row.append(expanded, compact('Dialyn', 2, 'D'), compact('Lucia', 3, 'L'));
      windowNode.append(row);
      section.append(windowNode);
      list.append(section);
    });
  </script>
</body>
</html>
  <link rel="stylesheet" href="expanded-slot-finalists-refinements.css">
