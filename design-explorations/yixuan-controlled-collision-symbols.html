<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yixuan Controlled Collision Posters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Mono", monospace;
        background: #0b0b0b;
        color: #e8e2d2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 0;
        margin: 0;
      }

      body {
        min-height: 100vh;
        background:
          linear-gradient(rgba(232, 226, 210, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(232, 226, 210, 0.035) 1px, transparent 1px),
          #0b0b0b;
        background-size: 30px 30px;
      }

      .page {
        width: min(1480px, 100%);
        margin: 0 auto;
        padding: 38px clamp(16px, 4vw, 62px) 70px;
      }

      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 28px;
        margin-bottom: 28px;
        border-bottom: 1px solid #363532;
        padding-bottom: 16px;
      }

      .intro h1 {
        margin: 0;
        font-family: "Big Shoulders Display", sans-serif;
        font-size: clamp(46px, 6.2vw, 86px);
        font-weight: 900;
        line-height: 0.82;
        letter-spacing: -0.025em;
        text-transform: uppercase;
      }

      .intro p {
        max-width: 43ch;
        margin: 0;
        color: #9c998f;
        font-size: 10px;
        line-height: 1.6;
        text-align: right;
        text-transform: uppercase;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(24px, 3vw, 42px);
      }

      figure {
        min-width: 0;
        margin: 0;
      }

      figure:last-child {
        grid-column: 1 / -1;
        width: calc(50% - clamp(12px, 1.5vw, 21px));
        justify-self: center;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding-top: 9px;
        color: #85827a;
        font-size: 9px;
        letter-spacing: 0.075em;
        text-transform: uppercase;
      }

      figcaption b {
        color: #e8e2d2;
        font-weight: 600;
      }

      .poster {
        position: relative;
        isolation: isolate;
        width: 100%;
        aspect-ratio: 2 / 1;
        overflow: hidden;
        background: #e8e2d2;
        opacity: 0;
        transform: translateY(10px);
        animation: reveal 420ms ease forwards;
      }

      figure:nth-child(2) .poster {
        animation-delay: 70ms;
      }

      figure:nth-child(3) .poster {
        animation-delay: 140ms;
      }

      .poster::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background:
          radial-gradient(circle, rgba(17, 16, 14, 0.14) 0 0.5px, transparent 0.7px),
          repeating-linear-gradient(0deg, transparent 0 5px, rgba(17, 16, 14, 0.028) 5px 6px);
        background-size: 5px 5px, auto;
        mix-blend-mode: multiply;
      }

      .portrait {
        position: absolute;
        z-index: 4;
        display: block;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
        filter: grayscale(1) contrast(1.28);
        transition: transform 360ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .poster:hover .portrait {
        transform: translate3d(0, -1%, 0) scale(1.018);
      }

      .display {
        font-family: "Big Shoulders Display", sans-serif;
        font-weight: 900;
        line-height: 0.76;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }

      .identity {
        position: absolute;
        z-index: 9;
        display: flex;
      }

      .identity-item {
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .game-symbol {
        display: block;
        flex: 0 0 auto;
        object-fit: contain;
      }

      .identity-copy {
        min-width: 0;
        text-transform: uppercase;
      }

      .identity-label {
        display: block;
        margin-bottom: 1px;
        font-size: clamp(5px, 0.55vw, 7px);
        line-height: 1.1;
        letter-spacing: 0.14em;
        opacity: 0.58;
      }

      .identity-value {
        display: block;
        font-size: clamp(7px, 0.78vw, 10px);
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: 0.035em;
        white-space: nowrap;
      }

      /* 01: vertical seam */
      .v01 {
        color: #11100e;
        background: #e8e2d2;
      }

      .v01::before {
        content: "";
        position: absolute;
        inset: 0 0 0 61%;
        z-index: 1;
        background: #11100e;
      }

      .v01 .seam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 60.4%;
        z-index: 7;
        width: 1.2%;
        background: #c99b26;
      }

      .v01 .portrait {
        left: -11%;
        bottom: -116%;
        width: 79%;
        height: 244%;
        mix-blend-mode: multiply;
      }

      .v01 .name {
        position: absolute;
        left: 4%;
        bottom: 7%;
        z-index: 8;
        color: #11100e;
        font-size: clamp(62px, 8.7vw, 118px);
      }

      .v01 .identity {
        top: 7%;
        right: 3.5%;
        bottom: 7%;
        width: 32%;
        flex-direction: column;
        justify-content: space-between;
        color: #e8e2d2;
      }

      .v01 .identity-item {
        gap: clamp(5px, 0.7vw, 10px);
        border-bottom: 1px solid rgba(232, 226, 210, 0.35);
        padding: 0 0 6px;
      }

      .v01 .game-symbol {
        width: clamp(28px, 3.3vw, 46px);
        height: clamp(28px, 3.3vw, 46px);
      }

      .v01 .identity-item:first-child .game-symbol {
        filter: drop-shadow(0 0 0.01px #e8e2d2);
      }

      /* 02: horizontal threshold */
      .v02 {
        color: #11100e;
        background: #e8e2d2;
      }

      .v02::before {
        content: "";
        position: absolute;
        inset: 65% 0 0;
        z-index: 1;
        background: #11100e;
      }

      .v02 .seam {
        position: absolute;
        right: 0;
        bottom: 33.7%;
        left: 0;
        z-index: 7;
        height: 1.3%;
        background: #c99b26;
      }

      .v02 .portrait {
        right: -4%;
        bottom: -111%;
        width: 73%;
        height: 237%;
        mix-blend-mode: multiply;
      }

      .v02 .name {
        position: absolute;
        left: 3.5%;
        top: 9%;
        z-index: 8;
        color: #11100e;
        font-size: clamp(66px, 9vw, 122px);
      }

      .v02 .identity {
        right: 3.5%;
        bottom: 4%;
        left: 25%;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(9px, 1.2vw, 18px);
        color: #e8e2d2;
      }

      .v02 .identity-item {
        gap: clamp(4px, 0.55vw, 8px);
      }

      .v02 .identity-item + .identity-item {
        border-left: 1px solid rgba(232, 226, 210, 0.38);
        padding-left: clamp(9px, 1.2vw, 18px);
      }

      .v02 .game-symbol {
        width: clamp(27px, 3vw, 42px);
        height: clamp(27px, 3vw, 42px);
      }

      /* 03: identity island */
      .v03 {
        color: #e8e2d2;
        background: #11100e;
      }

      .v03::before {
        content: "";
        position: absolute;
        inset: 0 69% 0 0;
        z-index: 1;
        background: #e8e2d2;
      }

      .v03 .gold-block {
        position: absolute;
        top: 0;
        left: 29.7%;
        z-index: 7;
        width: 1.5%;
        height: 68%;
        background: #c99b26;
      }

      .v03 .portrait {
        right: -16%;
        bottom: -124%;
        width: 91%;
        height: 254%;
        filter: grayscale(1) contrast(1.38);
      }

      .v03 .name {
        position: absolute;
        right: 3.5%;
        bottom: 6%;
        z-index: 8;
        color: #e8e2d2;
        font-size: clamp(62px, 8.7vw, 118px);
      }

      .v03 .identity {
        top: 7%;
        bottom: 7%;
        left: 2.8%;
        width: 25.5%;
        flex-direction: column;
        justify-content: space-between;
        color: #11100e;
      }

      .v03 .identity-item {
        gap: clamp(4px, 0.55vw, 8px);
        border-top: 1px solid rgba(17, 16, 14, 0.38);
        padding-top: 6px;
      }

      .v03 .game-symbol {
        width: clamp(27px, 3vw, 42px);
        height: clamp(27px, 3vw, 42px);
      }

      @keyframes reveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 860px) {
        .intro {
          display: grid;
        }

        .intro p {
          text-align: left;
        }

        .gallery {
          grid-template-columns: 1fr;
        }

        figure:last-child {
          grid-column: auto;
          width: 100%;
        }
      }

      @media (max-width: 480px) {
        .page {
          padding-inline: 10px;
        }

        .identity-label {
          display: none;
        }

        .v01 .identity {
          width: 34%;
        }

        .v02 .identity {
          left: 21%;
          gap: 5px;
        }

        .v02 .identity-item + .identity-item {
          padding-left: 5px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .poster {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .portrait {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Controlled<br />collision</h1>
        <p>
          One portrait, one name, one neutral collision. The in-game rank,
          attribute, and specialty symbols remain unchanged across all three.
        </p>
      </header>

      <section class="gallery" aria-label="Three controlled-collision Yixuan poster samples">
        <figure>
          <article class="poster v01" aria-label="Sample 1, vertical seam">
            <div class="seam" aria-hidden="true"></div>
            <img class="portrait" src="assets/yixuan-portrait.png" alt="Yixuan" />
            <div class="name display">Yixuan</div>
            <div class="identity" aria-label="Yixuan identity">
              <div class="identity-item">
                <img class="game-symbol" src="assets/zzz-rank-s.png" alt="" />
                <span class="identity-copy">
                  <span class="identity-label">Rank</span>
                  <span class="identity-value">S-Rank</span>
                </span>
              </div>
              <div class="identity-item">
                <img class="game-symbol" src="assets/zzz-attribute-auric-ink.png" alt="" />
                <span class="identity-copy">
                  <span class="identity-label">Attribute</span>
                  <span class="identity-value">Auric Ink</span>
                </span>
              </div>
              <div class="identity-item">
                <img class="game-symbol" src="assets/zzz-specialty-rupture.png" alt="" />
                <span class="identity-copy">
                  <span class="identity-label">Specialty</span>
                  <span class="identity-value">Rupture</span>
                </span>
              </div>
            </div>
          </article>
          <figcaption><b>01 Vertical seam</b><span>Portrait crosses / symbols hold</span></figcaption>
        </figure>

        <figure>
          <article class="poster v02" aria-label="Sample 2, horizontal threshold">
            <div class="seam" aria-hidden="true"></div>
            <img class="portrait" src="assets/yixuan-portrait.png" alt="Yixuan" />
            <div class="name display">Yixuan</div>
            <div class="identity" aria-label="Yixuan identity">
              <div class="identity-item">
                <img class="game-symbol" src="assets/zzz-rank-s.png" alt="" />
                <span class="identity-copy">
                  <span class="identity-label">Rank</span>
                  <span class="identity-value">S-Rank</span>
                </span>
              </div>
              <div class="identity-item">
                <img class="game-symbol" src="assets/zzz-attribute-auric-ink.png" alt="" />
                <span class="identity-copy">
                  <span class="identity-label">Attribute</span>
                  <span class="identity-value">Auric Ink</span>
                </span>
              </div>
              <div class="identity-item">
                <img class="game-symbol" src="assets/zzz-specialty-rupture.png" alt="" />
                <span class="identity-copy">
                  <span class="identity-label">Specialty</span>
                  <span class="identity-value">Rupture</span>
                </span>
              </div>
            </div>
          </article>
          <figcaption><b>02 Low threshold</b><span>Name above / symbols below</span></figcaption>
        </figure>

        <figure>
          <article class="poster v03" aria-label="Sample 3, identity island">
            <div class="gold-block" aria-hidden="true"></div>
            <img class="portrait" src="assets/yixuan-portrait.png" alt="Yixuan" />
            <div class="name display">Yixuan</div>
            <div class="identity" aria-label="Yixuan identity">
              <div class="identity-item">
                <img class="game-symbol" src="assets/zzz-rank-s.png" alt="" />
                <span class="identity-copy">
                  <span class="identity-label">Rank</span>
                  <span class="identity-value">S-Rank</span>
                </span>
              </div>
              <div class="identity-item">
                <img class="game-symbol" src="assets/zzz-attribute-auric-ink.png" alt="" />
                <span class="identity-copy">
                  <span class="identity-label">Attribute</span>
                  <span class="identity-value">Auric Ink</span>
                </span>
              </div>
              <div class="identity-item">
                <img class="game-symbol" src="assets/zzz-specialty-rupture.png" alt="" />
                <span class="identity-copy">
                  <span class="identity-label">Specialty</span>
                  <span class="identity-value">Rupture</span>
                </span>
              </div>
            </div>
          </article>
          <figcaption><b>03 Identity island</b><span>Symbols anchor / face overtakes</span></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
