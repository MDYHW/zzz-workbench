<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expanded slot / refined directions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="expanded-slot-refined-base.css">
  <link rel="stylesheet" href="expanded-slot-refined-corridors.css">
  <link rel="stylesheet" href="expanded-slot-refined-breaches.css">
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Refined<br>direction / 04</h1>
      <p>Two corridor-derived transitions and two rebalanced breaches. Compact slots now carry Agent portraits so the entire party row can be judged together.</p>
    </header>
    <div class="candidate-list" id="candidate-list"></div>
  </main>

  <template id="identity-template">
    <section class="identity" aria-label="Yixuan identity">
      <img class="agent-art art-full" src="assets/yixuan-portrait.png" alt="Yixuan">
      <img class="agent-art art-alt" src="assets/yixuan-trails-portrait.png" alt="Yixuan">
      <img class="agent-art art-card" src="assets/yixuan-mechanics-01.jpg" alt="Yixuan">
      <h3 class="agent-name">Yixuan</h3>
      <span class="focus">Focus / Slot 01</span>
      <div class="agent-symbols" aria-label="S-Rank, Auric Ink, Rupture">
        <img src="assets/zzz-rank-s.png" alt="S-Rank">
        <img src="assets/zzz-attribute-auric-ink.png" alt="Auric Ink">
        <img src="assets/zzz-specialty-rupture.png" alt="Rupture">
      </div>
    </section>
  </template>

  <template id="setup-template">
    <section class="setup" aria-label="Yixuan setup">
      <header class="section-label"><div><span>Prepared inputs</span><h3>Setup</h3></div><b>EDITABLE</b></header>
      <div class="setup-flow">
        <div class="setting-row"><span class="setting-index">01 / State</span><span class="setting-copy"><strong>Mindscape M0</strong><small>Lv.60 ? Core max</small></span><span class="setting-mark">?</span></div>
        <div class="setting-row"><span class="setting-index">02 / Pool</span><span class="setting-copy"><strong>Full W-Engine pool</strong><small>Limited + standard</small></span><span class="setting-mark">?</span></div>
        <div class="setting-row"><span class="setting-index">03 / Engine</span><span class="setting-copy"><strong>Qingming Birdcage</strong><small>W1 ? Rank default</small></span><span class="setting-mark">?</span></div>
        <div class="setting-row"><span class="setting-index">04 / Discs</span><span class="setting-copy"><strong>Yunkui Tales 4</strong><small>Woodpecker Electro 2</small></span><span class="setting-mark">?</span></div>
      </div>
      <div class="setup-foot">
        <div class="main-stats"><span>D4<b>CRIT Rate</b></span><span>D5<b>Ether DMG</b></span><span>D6<b>HP</b></span></div>
        <div class="substats"><span>CRIT Rate<b>3</b></span><span>CRIT DMG<b>3</b></span><span>HP<b>4</b></span><span>ATK<b>2</b></span></div>
      </div>
    </section>
  </template>

  <template id="result-template">
    <section class="result" aria-label="Yixuan Result">
      <header class="section-label"><div><span>Current setup</span><h3>Result</h3></div><b>LIVE</b></header>
      <div class="surface-head"><span>Important value</span><span>Initial</span><span>Combat</span><span>Fully enabled</span></div>
      <table class="metrics" aria-label="Important Result values">
        <tbody>
          <tr><th>Max HP</th><td>16,890</td><td>16,890</td><td>19,340</td></tr>
          <tr><th>Sheer Force</th><td>2,104</td><td>2,104</td><td>2,432</td></tr>
          <tr><th>CRIT Rate</th><td>58.6%</td><td>78.6%</td><td>83.4%</td></tr>
          <tr><th>CRIT DMG</th><td>64.4%</td><td>64.4%</td><td>154.4%</td></tr>
        </tbody>
      </table>
      <div class="gauge">
        <div class="gauge-labels"><span>Fully enabled CRIT Rate</span><span>83.4 / 100%</span></div>
        <div class="gauge-track"><span class="gauge-fill"></span><i class="gauge-cap"></i></div>
      </div>
      <div class="actions">
        <span>Material action difference</span>
        <div class="action-values"><span>Basic Attack<b>+58</b></span><span>EX Special<b>+78</b></span><span>Ultimate<b>+78</b></span></div>
      </div>
    </section>
  </template>

  <script>
    const directions = [
      { n: '01', cls: 'soft-seam', title: 'Soft seam', note: 'Corridor / standing portrait dissolves into one continuous setup rail' },
      { n: '02', cls: 'signal-veil', title: 'Signal veil', note: 'Corridor / face poster and setup share a field before the Result cut' },
      { n: '03', cls: 'measured-breach', title: 'Measured breach', note: 'Steps / setup crosses the boundary at a calmer, Result-safe scale' },
      { n: '04', cls: 'ribbon-current', title: 'Ribbon current', note: 'Hybrid / soft identity seam becomes narrowing ribbons toward Result' }
    ];

    const clone = id => document.getElementById(id).content.cloneNode(true);
    const compact = (agent, index, role, image) => {
      const node = document.createElement('aside');
      node.className = 'compact compact-' + agent.toLowerCase();
      node.setAttribute('aria-label', `${agent}, compact party slot`);
      node.innerHTML = `<img class="compact-art" src="${image}" alt="${agent}"><span class="compact-index">0${index}</span><div class="compact-copy"><h3>${agent}</h3><p>S-Rank / ${role}<br>Party slot 0${index}</p></div>`;
      return node;
    };

    const list = document.getElementById('candidate-list');
    directions.forEach(item => {
      const candidate = document.createElement('section');
      candidate.className = 'candidate';
      candidate.innerHTML = `<header class="candidate-heading"><h2>${item.n} / ${item.title}</h2><p>${item.note}</p></header>`;
      const windowNode = document.createElement('div');
      windowNode.className = 'rail-window';
      const row = document.createElement('div');
      row.className = `party-row ${item.cls}-row`;
      const expanded = document.createElement('article');
      expanded.className = `expanded ${item.cls}`;
      expanded.append(clone('identity-template'), clone('setup-template'), clone('result-template'));
      row.append(expanded, compact('Dialyn', 2, 'Stun', 'assets/dialyn-card.webp'), compact('Lucia', 3, 'Support', 'assets/lucia-card.webp'));
      windowNode.append(row);
      candidate.append(windowNode);
      list.append(candidate);
    });
  </script>
</body>
</html>
  <link rel="stylesheet" href="expanded-slot-refined-pass2.css">
