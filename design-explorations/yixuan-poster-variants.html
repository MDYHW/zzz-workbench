<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yixuan Poster Grammar ? 10 Routes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Mono", monospace;
        background: #0b0c0d;
        color: #f2efe4;
      }
      * { box-sizing: border-box; }
      html, body { min-width: 0; margin: 0; }
      body {
        background:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
          #0b0c0d;
        background-size: 32px 32px;
      }
      .page {
        width: min(1500px, 100%);
        margin: 0 auto;
        padding: 48px clamp(16px, 4vw, 64px) 80px;
      }
      .intro {
        display: grid;
        grid-template-columns: minmax(0,1fr) auto;
        gap: 24px;
        align-items: end;
        margin-bottom: 32px;
        border-bottom: 1px solid #3b3e40;
        padding-bottom: 20px;
      }
      .intro h1 {
        margin: 0;
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(48px, 8vw, 104px);
        font-weight: 400;
        line-height: .82;
        letter-spacing: -.02em;
      }
      .intro p {
        max-width: 48ch;
        margin: 0;
        color: #aeb2b4;
        font-size: 12px;
        line-height: 1.65;
        text-align: right;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr));
        gap: clamp(24px, 4vw, 48px);
      }
      figure { min-width: 0; margin: 0; }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding-top: 10px;
        color: #9da1a3;
        font-size: 11px;
        letter-spacing: .04em;
        text-transform: uppercase;
      }
      figcaption b { color: #f2efe4; font-weight: 500; }
      .poster {
        position: relative;
        isolation: isolate;
        width: 100%;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        transform: translateY(12px);
        opacity: 0;
        animation: enter 560ms ease forwards;
      }
      figure:nth-child(2) .poster { animation-delay: 60ms; }
      figure:nth-child(3) .poster { animation-delay: 120ms; }
      figure:nth-child(4) .poster { animation-delay: 180ms; }
      figure:nth-child(5) .poster { animation-delay: 240ms; }
      figure:nth-child(6) .poster { animation-delay: 300ms; }
      figure:nth-child(7) .poster { animation-delay: 360ms; }
      figure:nth-child(8) .poster { animation-delay: 420ms; }
      figure:nth-child(9) .poster { animation-delay: 480ms; }
      figure:nth-child(10) .poster { animation-delay: 540ms; }
      .poster img {
        position: absolute;
        display: block;
        pointer-events: none;
        user-select: none;
        transition: transform 420ms cubic-bezier(.2,.8,.2,1);
      }
      .poster:hover img { transform: translate3d(0,-1.5%,0) scale(1.025); }
      .display {
        font-family: "Bebas Neue", sans-serif;
        font-weight: 400;
        line-height: .82;
        letter-spacing: -.02em;
        text-transform: uppercase;
      }
      .micro {
        font-size: clamp(8px, 1vw, 11px);
        line-height: 1.35;
        letter-spacing: .05em;
        text-transform: uppercase;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid currentColor;
        padding: 4px 7px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .scan {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        background: repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.07) 3px 4px);
        mix-blend-mode: multiply;
      }

      /* 01 ? acid transit */
      .p01 { color: #0a0a09; background: #f2eddf; }
      .p01::before {
        content: "";
        position: absolute;
        inset: -5% 37% -6% -18%;
        z-index: -1;
        background: #f3ed22;
        transform: skewX(-12deg);
      }
      .p01::after {
        content: "13 / YKS / 06";
        position: absolute;
        right: -42px;
        top: 50%;
        padding: 8px 80px;
        color: #f2eddf;
        background: #0a0a09;
        font-size: 10px;
        letter-spacing: .2em;
        transform: rotate(90deg) translateY(-50%);
      }
      .p01 img {
        z-index: 2;
        right: -4%;
        bottom: -5%;
        width: 76%;
        height: 104%;
        object-fit: contain;
        object-position: right bottom;
      }
      .p01 .route {
        position: absolute;
        top: 5%;
        left: 5%;
        z-index: 4;
        width: 48%;
        border-top: 7px solid #0a0a09;
        padding-top: 8px;
      }
      .p01 .name {
        position: absolute;
        left: 4%;
        bottom: 5%;
        z-index: 4;
        font-size: clamp(70px,13vw,154px);
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }
      .p01 .stamp {
        position: absolute;
        top: 32%;
        left: 25%;
        z-index: 4;
        border: 3px solid #0a0a09;
        padding: 7px 9px;
        font-size: 12px;
        transform: rotate(-7deg);
      }

      /* 02 ? cobalt editorial */
      .p02 { color: #122b79; background: #efefe1; }
      .p02::before {
        content: "";
        position: absolute;
        inset: 0 67% 0 0;
        background: #1647d8;
      }
      .p02::after {
        content: "";
        position: absolute;
        left: 25%;
        right: 0;
        top: 39%;
        height: 18%;
        z-index: 1;
        background: #ff482d;
        transform: skewY(-5deg);
      }
      .p02 img {
        left: 19%;
        bottom: -22%;
        z-index: 3;
        width: 84%;
        height: 118%;
        object-fit: contain;
        object-position: center top;
      }
      .p02 .issue { position: absolute; top: 5%; left: 5%; z-index: 5; color: #efefe1; }
      .p02 .name {
        position: absolute;
        top: 6%;
        right: 4%;
        z-index: 5;
        max-width: 46%;
        color: #1647d8;
        font-size: clamp(72px,12vw,146px);
        text-align: right;
      }
      .p02 .aside {
        position: absolute;
        right: 4%;
        bottom: 4%;
        z-index: 5;
        width: 33%;
        border-top: 2px solid currentColor;
        padding-top: 8px;
      }
      .p02 .rank { position: absolute; left: 5%; bottom: 4%; z-index: 5; color: #efefe1; font-size: 54px; }

      /* 03 ? vermilion newsprint */
      .p03 {
        color: #2a1b18;
        background:
          radial-gradient(circle at 20% 40%,rgba(42,27,24,.16) 0 1px,transparent 1.5px) 0 0 / 6px 6px,
          #f0d4a7;
      }
      .p03::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(116deg,transparent 0 45%,#9e1721 45% 68%,transparent 68%);
      }
      .p03 img {
        right: -6%;
        bottom: -4%;
        z-index: 2;
        width: 80%;
        height: 101%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.32);
        mix-blend-mode: multiply;
      }
      .p03 .mast {
        position: absolute;
        inset: 5% auto auto 5%;
        z-index: 5;
        width: 90%;
        border-top: 2px solid;
        border-bottom: 2px solid;
        padding: 8px 0;
      }
      .p03 .name {
        position: absolute;
        left: 4%;
        top: 18%;
        z-index: 5;
        width: 54%;
        color: #9e1721;
        font-size: clamp(82px,15vw,170px);
      }
      .p03 .copy {
        position: absolute;
        left: 5%;
        bottom: 6%;
        z-index: 5;
        width: 34%;
        border-left: 8px solid #9e1721;
        padding-left: 10px;
      }

      /* 04 ? cyan night metro */
      .p04 {
        color: #d8f8f2;
        background:
          linear-gradient(rgba(41,224,242,.08) 1px,transparent 1px),
          linear-gradient(90deg,rgba(41,224,242,.08) 1px,transparent 1px),
          #071624;
        background-size: 22px 22px;
      }
      .p04::before, .p04::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 44%;
        border: 1px solid #29e0f2;
        border-radius: 50%;
        transform: translate(-50%,-50%);
      }
      .p04::before { width: 72%; aspect-ratio: 1; }
      .p04::after { width: 53%; aspect-ratio: 1; border-color: #ff7b2c; border-width: 8px; }
      .p04 img {
        left: 22%;
        top: 3%;
        z-index: 2;
        width: 60%;
        height: 78%;
        object-fit: cover;
        object-position: 50% 10%;
        clip-path: circle(34% at 50% 42%);
      }
      .p04 .signal { position: absolute; top: 4%; left: 4%; z-index: 4; color: #29e0f2; }
      .p04 .name {
        position: absolute;
        left: 5%;
        right: 5%;
        bottom: 12%;
        z-index: 5;
        color: #ff7b2c;
        font-size: clamp(80px,15vw,168px);
        text-align: center;
        text-shadow: 5px 5px 0 #071624;
      }
      .p04 .platform {
        position: absolute;
        left: 5%;
        right: 5%;
        bottom: 4%;
        z-index: 5;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .p04 .line { height: 1px; background: #29e0f2; }

      /* 05 ? mint receipt */
      .p05 { color: #112d38; background: #bfe3ca; }
      .p05::before {
        content: "";
        position: absolute;
        left: 9%;
        top: 5%;
        bottom: 5%;
        width: 44%;
        z-index: 1;
        background:
          repeating-linear-gradient(0deg,transparent 0 27px,rgba(17,45,56,.12) 27px 28px),
          #fff8e9;
        box-shadow: 12px 12px 0 #112d38;
      }
      .p05 img {
        left: 9%;
        top: 23%;
        z-index: 2;
        width: 44%;
        height: 48%;
        object-fit: cover;
        object-position: 50% 14%;
        filter: saturate(.68) contrast(1.06);
      }
      .p05 .receipt { position: absolute; left: 13%; top: 9%; z-index: 4; width: 36%; }
      .p05 .name {
        position: absolute;
        left: 58%;
        top: 8%;
        z-index: 4;
        font-size: clamp(68px,12vw,140px);
        writing-mode: vertical-rl;
      }
      .p05 .barcode {
        position: absolute;
        left: 13%;
        bottom: 9%;
        z-index: 4;
        width: 36%;
        height: 10%;
        background: repeating-linear-gradient(90deg,#112d38 0 2px,transparent 2px 4px,#112d38 4px 9px,transparent 9px 12px);
      }
      .p05 .index {
        position: absolute;
        right: 6%;
        bottom: 7%;
        z-index: 4;
        width: 34%;
        border-top: 2px solid;
        padding-top: 8px;
      }

      /* 06 ? warning splice */
      .p06 { color: #eee4d6; background: #11100e; }
      .p06::before {
        content: "";
        position: absolute;
        left: -8%;
        right: -8%;
        top: 42%;
        height: 20%;
        z-index: 3;
        background: #ff5a1f;
        transform: rotate(-9deg);
      }
      .p06 img {
        right: -4%;
        bottom: -13%;
        z-index: 2;
        width: 84%;
        height: 112%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.35);
      }
      .p06 .serial { position: absolute; left: 5%; top: 5%; z-index: 5; color: #ff5a1f; }
      .p06 .name {
        position: absolute;
        left: 4%;
        top: 13%;
        z-index: 5;
        width: 55%;
        font-size: clamp(96px,18vw,200px);
      }
      .p06 .cut {
        position: absolute;
        left: 5%;
        bottom: 5%;
        z-index: 5;
        width: 47%;
        padding: 10px;
        color: #11100e;
        background: #eee4d6;
        clip-path: polygon(0 0,100% 0,92% 100%,0 100%);
      }

      /* 07 ? lilac record sleeve */
      .p07 { color: #191322; background: #cab8fb; }
      .p07::before {
        content: "";
        position: absolute;
        right: -21%;
        top: -12%;
        width: 84%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle,#ff6b4a 0 8%,#191322 8% 10%,#cab8fb 10% 11%,#191322 11% 52%,#ff6b4a 52% 53%,#191322 53%);
      }
      .p07 img { right: -3%; bottom: -6%; z-index: 2; width: 72%; height: 103%; object-fit: contain; }
      .p07 .label { position: absolute; top: 6%; left: 5%; z-index: 4; width: 37%; }
      .p07 .name {
        position: absolute;
        left: 4%;
        bottom: 9%;
        z-index: 4;
        color: #ff6b4a;
        font-size: clamp(78px,14vw,158px);
        text-shadow: 3px 3px 0 #191322;
        transform: rotate(-5deg);
      }
      .p07 .edition { position: absolute; right: 5%; bottom: 4%; z-index: 4; color: #cab8fb; }

      /* 08 ? red archive cover */
      .p08 { color: #f3ecdf; background: #a71724; }
      .p08::before {
        content: "13";
        position: absolute;
        left: -2%;
        top: -10%;
        z-index: 1;
        color: rgba(243,236,223,.18);
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(340px,55vw,650px);
        line-height: 1;
      }
      .p08 img {
        right: -10%;
        bottom: -2%;
        z-index: 2;
        width: 78%;
        height: 89%;
        object-fit: cover;
        object-position: center 12%;
        filter: grayscale(1) contrast(1.25);
        mix-blend-mode: multiply;
      }
      .p08 .head {
        position: absolute;
        top: 4%;
        left: 4%;
        right: 4%;
        z-index: 4;
        display: flex;
        justify-content: space-between;
        border-top: 7px solid;
        padding-top: 8px;
      }
      .p08 .name { position: absolute; left: 4%; bottom: 5%; z-index: 4; font-size: clamp(90px,17vw,190px); }
      .p08 .sidecopy { position: absolute; top: 22%; left: 5%; z-index: 4; width: 24%; border-left: 1px solid; padding-left: 8px; }

      /* 09 ? white archive */
      .p09 {
        color: #11110f;
        background:
          linear-gradient(90deg,transparent 0 14.8%,rgba(17,17,15,.12) 14.8% 15%,transparent 15% 84.8%,rgba(17,17,15,.12) 84.8% 85%,transparent 85%),
          #f5f4ec;
      }
      .p09::before {
        content: "";
        position: absolute;
        left: 15%;
        top: 15%;
        width: 70%;
        height: 1px;
        background: #11110f;
        box-shadow: 0 49vh 0 rgba(17,17,15,.35);
      }
      .p09 img {
        left: 34%;
        top: 27%;
        z-index: 2;
        width: 34%;
        height: 44%;
        object-fit: cover;
        object-position: 50% 8%;
        filter: grayscale(1) contrast(1.15);
      }
      .p09 .catalog { position: absolute; top: 5%; left: 4%; right: 4%; display: flex; justify-content: space-between; }
      .p09 .name {
        position: absolute;
        left: 7%;
        top: 18%;
        z-index: 4;
        color: #d0ec1d;
        font-size: clamp(92px,17vw,192px);
        mix-blend-mode: multiply;
      }
      .p09 .record { position: absolute; right: 5%; bottom: 5%; z-index: 4; width: 31%; text-align: right; }
      .p09 .mark {
        position: absolute;
        left: 5%;
        bottom: 5%;
        z-index: 4;
        width: 44px;
        height: 44px;
        border: 10px solid #11110f;
        transform: rotate(45deg);
      }

      /* 10 ? auric terminal */
      .p10 {
        color: #dcefe8;
        background: linear-gradient(rgba(220,239,232,.08) 1px,transparent 1px),#0b2924;
        background-size: 100% 18px;
      }
      .p10::before {
        content: "";
        position: absolute;
        inset: 8% 8% 13%;
        border: 1px solid #dcefe8;
        clip-path: polygon(0 0,88% 0,100% 10%,100% 100%,12% 100%,0 90%);
      }
      .p10 img {
        left: 27%;
        bottom: -3%;
        z-index: 2;
        width: 70%;
        height: 95%;
        object-fit: contain;
        filter: grayscale(1) sepia(.35) saturate(1.8) contrast(1.1);
      }
      .p10 .ghost {
        left: 7%;
        bottom: 18%;
        z-index: 1;
        width: 38%;
        height: 58%;
        object-fit: contain;
        opacity: .22;
        filter: grayscale(1) sepia(1) saturate(4) hue-rotate(350deg);
      }
      .p10 .topline { position: absolute; top: 4%; left: 5%; right: 5%; z-index: 5; display: flex; justify-content: space-between; color: #e4b743; }
      .p10 .name { position: absolute; left: 4%; bottom: 5%; z-index: 5; color: #e4b743; font-size: clamp(90px,16vw,182px); }
      .p10 .readout { position: absolute; left: 7%; top: 21%; z-index: 5; width: 31%; border-left: 3px solid #e4b743; padding-left: 9px; }

      @keyframes enter { to { transform: translateY(0); opacity: 1; } }
      @media (max-width: 680px) {
        .page { padding-top: 28px; }
        .intro { grid-template-columns: 1fr; }
        .intro p { text-align: left; }
      }
      @media (prefers-reduced-motion: reduce) {
        .poster { transform: none; opacity: 1; animation: none; }
        .poster img { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Ten routes<br />one agent</h1>
        <p>A visual-grammar study, not product UI. Each route keeps the same minimal Yixuan identity while changing structure, crop, density, and color.</p>
      </header>
      <section class="gallery" aria-label="Yixuan poster style variants">
        <figure>
          <article class="poster p01" aria-label="Sample 1, acid transit poster">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="route micro">New Eridu route<br />Yunkui / no. 13</div>
            <div class="name display">Yixuan</div>
            <div class="stamp micro">Auric Ink<br />Rupture</div>
          </article>
          <figcaption><b>01 Acid transit</b><span>Diagonal / wayfinding</span></figcaption>
        </figure>
        <figure>
          <article class="poster p02" aria-label="Sample 2, cobalt editorial poster">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="issue micro">Issue 02<br />Agent profile</div>
            <div class="name display">Yi<br />xuan</div>
            <div class="rank display">S</div>
            <div class="aside micro">Auric Ink / Rupture<br />Yunkui Summit</div>
          </article>
          <figcaption><b>02 Cobalt editorial</b><span>Display type / color field</span></figcaption>
        </figure>
        <figure>
          <article class="poster p03" aria-label="Sample 3, vermilion newsprint poster">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="mast micro">New Eridu Dispatch ? 13th High Preceptor</div>
            <div class="name display">Yixuan</div>
            <div class="copy micro">Yunkui Summit<br />Auric Ink<br />Rupture</div>
            <div class="scan"></div>
          </article>
          <figcaption><b>03 Vermilion print</b><span>Newsprint / ink</span></figcaption>
        </figure>
        <figure>
          <article class="poster p04" aria-label="Sample 4, cyan night metro poster">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="signal micro"><span class="tag"><i class="dot"></i> Signal live</span></div>
            <div class="name display">Yixuan</div>
            <div class="platform micro"><span>YKS</span><i class="line"></i><span>13:06</span></div>
          </article>
          <figcaption><b>04 Night metro</b><span>Night route / signal ring</span></figcaption>
        </figure>
        <figure>
          <article class="poster p05" aria-label="Sample 5, mint receipt poster">
            <img src="assets/yixuan-mechanics-01.jpg" alt="" />
            <div class="receipt micro">Agent receipt<br />No. 00013<br />Status / Active</div>
            <div class="name display">Yixuan</div>
            <div class="barcode"></div>
            <div class="index micro">Auric Ink<br />Rupture<br />Yunkui Summit</div>
          </article>
          <figcaption><b>05 Mint receipt</b><span>Receipt / small portrait</span></figcaption>
        </figure>
        <figure>
          <article class="poster p06" aria-label="Sample 6, warning splice poster">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="serial micro">Sector 06 / Attention</div>
            <div class="name display">Yi<br />xuan</div>
            <div class="cut micro">Identity confirmed<br />Auric Ink / Rupture</div>
          </article>
          <figcaption><b>06 Warning splice</b><span>Splice / caution band</span></figcaption>
        </figure>
        <figure>
          <article class="poster p07" aria-label="Sample 7, lilac record sleeve poster">
            <img src="assets/yixuan-trails-portrait.png" alt="" />
            <div class="label micro">New Eridu archives<br />Special edition</div>
            <div class="name display">Yixuan</div>
            <div class="edition micro">YKS ? 13<br />Side A</div>
          </article>
          <figcaption><b>07 Lilac vinyl</b><span>Record sleeve / pop color</span></figcaption>
        </figure>
        <figure>
          <article class="poster p08" aria-label="Sample 8, red archive cover poster">
            <img src="assets/yixuan-mechanics-01.jpg" alt="" />
            <div class="head micro"><span>Archive 13</span><span>NE / YKS</span></div>
            <div class="sidecopy micro">High Preceptor<br />Auric Ink<br />Rupture</div>
            <div class="name display">Yixuan</div>
            <div class="scan"></div>
          </article>
          <figcaption><b>08 Red archive</b><span>Magazine cover / numeral</span></figcaption>
        </figure>
        <figure>
          <article class="poster p09" aria-label="Sample 9, minimal white archive poster">
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="catalog micro"><span>NEA?013</span><span>Filed 06.06</span></div>
