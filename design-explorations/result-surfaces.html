<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rupture source surface notation</title>
<link rel="stylesheet" href="/src/app.css">
<style>
body{overflow-x:auto}.lab-shell{width:min(1320px,calc(100% - 28px));margin:auto;padding:14px 0 72px}.lab-masthead{margin-bottom:18px}.lab-masthead .masthead__status{grid-template-columns:1fr}.lab-masthead .masthead__status strong{font-size:14px}.lab-intro{display:flex;justify-content:space-between;gap:20px;margin:0 0 34px;padding:11px 14px;border:1px solid #4d4942;background:#1b1a17;color:#b4aea2;font:700 10px/1.55 var(--mono)}.lab-intro b{color:var(--accent-soft)}.selected-heading{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:13px;width:min(820px,100%);margin:0 auto 9px}.selected-index{display:grid;width:42px;height:38px;place-items:center;background:var(--accent);color:var(--ink);font:900 11px/1 var(--mono);clip-path:polygon(0 0,83% 0,100% 31%,100% 100%,14% 100%,0 72%)}.selected-heading h2{margin:0;color:#eee9dd;font-family:"Bahnschrift Condensed","Arial Narrow",sans-serif;font-size:25px;line-height:.9;letter-spacing:-.02em;text-transform:uppercase}.selected-heading p{max-width:540px;margin:4px 0 0;color:#9f998e;font:700 9px/1.4 var(--mono)}.selected-heading>small{color:var(--accent-soft);font:800 8px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.result-frame{width:min(820px,100%);margin:auto;border:1px solid #625e56;background:#1d1c19;box-shadow:7px 7px 0 rgba(0,0,0,.32)}.result-frame .result-panel{min-height:0;margin-left:0;padding:18px 16px 22px 42px}.result-frame .result-heading h2{font-size:42px}.result-frame .agent-result thead th{font-size:10px}.result-frame .agent-result tbody td{font-size:16px}.result-frame .metric-toggle,.result-frame .metric-label{min-height:42px;font-size:13px}.result-frame .source-matrix thead th{font-size:9px}.result-frame .source-matrix thead th:first-child{width:36%}.result-frame .source-matrix tbody th,.result-frame .source-matrix tbody td{height:35px;padding:7px 8px;font-size:11px}.result-frame .breakdown-grid{display:block;padding:6px}.source-matrix tbody th{white-space:normal!important}.source-copy span{white-space:normal!important}.metric-detail[hidden],.action-source-detail[hidden]{display:none}.hierarchy-caption{display:flex;align-items:center;gap:7px;margin:8px 0 6px;color:#705619;font:900 10px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase}.hierarchy-caption:before{content:"↳";color:#8a8175;font-size:13px}.action-zone{--action-table-indent:18px;position:relative;padding-left:var(--action-table-indent);border-left:0}.result-frame .action-matrix thead th:first-child,.result-frame .action-source-shell .source-matrix thead th:first-child{width:calc(36% - 12px)}.action-matrix tbody th{color:#34322e}.action-matrix tbody th i{display:none}.action-matrix>tbody>tr:not(.action-source-detail)>th{padding:0}.action-row-toggle{display:grid;width:100%;min-height:42px;grid-template-columns:minmax(0,1fr) 20px;align-items:center;gap:8px;padding:7px 8px;border:0;background:transparent;color:#34322e;font:800 11px/1.2 var(--mono);text-align:left;cursor:pointer}.action-lines{display:grid;gap:2px;min-width:0}.action-lines span{display:block}.action-matrix .action-row-toggle i{display:grid;width:20px;height:20px;place-items:center;background:var(--ink);color:#f3eee4;font:normal 900 11px/1 var(--mono);clip-path:none;margin:0;vertical-align:middle}.action-matrix .action-row-toggle[aria-expanded=true] i{background:var(--ink);color:#f3eee4}.action-row-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.action-result{display:flex;flex-direction:column;align-items:flex-end;gap:3px}.action-result b{color:#24231f!important;font-size:14px}.action-result small{color:#766f64;font:900 8px/1 var(--mono)}.action-result--empty{color:#908a80}.action-source-detail>td{padding:0!important;background:#e2dcd0}.action-source-shell{margin-left:0;border-left:0}.action-source-shell .source-matrix-wrap{border-width:1px 0 0;border-color:#b9b1a4}.action-source-shell .source-matrix tbody th{width:calc(36% - 12px)}.action-source-shell .source-matrix tbody th i{display:inline-block}.action-source-shell .source-matrix tbody th{color:var(--source-color)}.flow-note{width:min(820px,100%);margin:8px auto 0;color:#817b72;font:700 8px/1.45 var(--mono);letter-spacing:.04em;text-transform:uppercase}.flow-note b{color:#aaa399}.stage{display:inline-flex;align-items:center;gap:5px;margin-left:7px}.stage i{display:grid;width:15px;height:15px;place-items:center;background:#d1c9bc;color:#4b4740;font-style:normal}.stage i.on{background:var(--accent);color:var(--ink)}
@media(max-width:760px){.selected-heading{grid-template-columns:42px 1fr}.selected-heading>small{grid-column:2}.result-frame{overflow-x:auto}.result-frame .result-panel{min-width:690px;padding-left:30px}}

/* Shared surface tracks with a dedicated hierarchy gutter. */
.action-zone{--action-hierarchy-gutter:18px;padding-left:0}
.action-zone>.source-matrix-wrap{overflow:visible;border:0;background:transparent}
.action-matrix col.action-hierarchy-track{width:var(--action-hierarchy-gutter)}
.action-matrix col.action-label-track{width:calc(36% - var(--action-hierarchy-gutter))}
.action-matrix col.action-surface-track{width:21.333333%}
.result-frame .action-matrix thead th:first-child{width:auto}
.action-matrix thead .action-hierarchy-cell,
.action-matrix tbody .action-hierarchy-cell{height:auto;padding:0;border:0;background:transparent}
.action-matrix thead th:not(.action-hierarchy-cell){border-top:1px solid #aaa397}
.action-matrix thead th:nth-child(2){border-left:1px solid #aaa397;text-align:left}
.action-matrix thead th:last-child{border-right:1px solid #aaa397}
.action-matrix>tbody>tr>th,
.action-matrix>tbody>tr>td:not(.action-hierarchy-cell){border-bottom:1px solid #d1c9bc;background:#ece6da}
.action-matrix>tbody>tr>th{border-left:1px solid #aaa397}
.action-matrix>tbody>tr>td:last-child{border-right:1px solid #aaa397}
.action-matrix>tbody.action-source-detail>tr>th,
.action-matrix>tbody.action-source-detail>tr>td:not(.action-hierarchy-cell){padding:7px 8px;background:#e2dcd0}
.action-matrix>tbody.action-source-detail th i{display:inline-block}


.action-matrix>tbody.action-source-detail>tr>th{color:var(--source-color)}
.action-source-arrow{display:inline-block;margin-right:7px;color:#8a8175;font:900 12px/1 var(--mono);vertical-align:0}
.action-matrix>tbody.action-source-detail>tr.source-link{background:transparent;box-shadow:none}
.action-matrix>tbody.action-source-detail>tr.source-link>th,
.action-matrix>tbody.action-source-detail>tr.source-link>td:not(.action-hierarchy-cell){transition:background 120ms ease,box-shadow 120ms ease}
.action-matrix>tbody.action-source-detail>tr.source-link:is(:hover,.is-source-active,:focus-within){background:transparent;box-shadow:none}
.action-matrix>tbody.action-source-detail>tr.source-link:is(:hover,.is-source-active,:focus-within)>th,
.action-matrix>tbody.action-source-detail>tr.source-link:is(:hover,.is-source-active,:focus-within)>td:not(.action-hierarchy-cell){background:#f7f1e6}
.action-matrix>tbody.action-source-detail>tr.source-link:is(:hover,.is-source-active,:focus-within)>th{box-shadow:inset 3px 0 0 var(--source-color)}
/* Rupture recalculation notation comparison. Keep the production Result grammar. */
.variant-stack{display:grid;gap:42px}.variant-heading{margin-bottom:10px}.variant-heading>small{align-self:start;padding-top:4px}.variant-heading .selected-index{background:#efe9dd}.variant-heading[data-recommended=true] .selected-index{background:var(--accent)}.variant-heading[data-recommended=true]>small{color:var(--accent)}.variant-frame .result-panel{padding-top:14px}.variant-frame .result-heading{margin-bottom:10px}.variant-frame .result-heading h2{font-size:35px}.variant-frame .result-heading:after{content:"SHEER FORCE";align-self:end;color:#8f897e;font:900 8px/1 var(--mono);letter-spacing:.08em}.variant-frame .breakdown-grid{padding:6px}.variant-frame .source-matrix tbody td{vertical-align:middle}.notation-value{display:inline-flex;align-items:center;justify-content:flex-end;gap:5px;min-height:19px}.notation-value b{font-size:12px}.notation-value--recalc em{display:grid;width:17px;height:17px;place-items:center;background:#3b3730;color:var(--accent);font:normal 900 11px/1 var(--mono)}.notation-same{color:#8a8378;font:900 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}.notation-stack{display:inline-grid;justify-items:end;gap:3px}.notation-stack b{font-size:12px}.notation-stack small{color:#6f675d;font:900 8px/1 var(--mono);letter-spacing:.03em}.notation-inputs{display:inline-grid;justify-items:end;gap:3px}.notation-inputs small{color:#766f64;font:900 7px/1 var(--mono);letter-spacing:.03em}.variant-verdict{width:min(820px,100%);margin:7px auto 0;padding-left:2px;color:#888176;font:700 8px/1.5 var(--mono);letter-spacing:.025em}.variant-verdict b{color:#b5ada1}</style>
</head>
<body>
<div class="lab-shell">
<header class="masthead lab-masthead"><div class="masthead__index">RESULT // LAB</div><div class="masthead__title"><span class="eyebrow">SURFACE RECALCULATION</span><h1>RUPTURE SOURCE</h1></div><div class="masthead__status"><span>SAME ARITHMETIC</span><strong>5 NOTATIONS</strong></div></header>
<p class="lab-intro"><span><b>Fixed values:</b> Rupture specialty contributes 2,222.7 at Initial and Combat, then recalculates to 2,551.4 at Fully enabled. Lucia directly adds 814.8, producing 3,366.2.</span><span>Only the notation changes.</span></p>

<main class="variant-stack" id="rupture-variants" aria-label="Rupture source notation comparisons"></main>


</div>
<script>
var ruptureVariants=[
  {
    id:'A',
    title:'Incremental delta',
    tag:'One row · plus only',
    note:'The row identity connects both values. Fully enabled shows only the increase caused by recalculating the same formula.',
    verdict:'Most compact and closest to the current incremental-source grammar, but <b>+328.7</b> can still look like a separately activated effect.',
    cells:['<span class="notation-value"><b>+2,222.7</b></span>','', '<span class="notation-value"><b>+328.7</b></span>']
  },
  {
    id:'B',
    title:'Contribution at every surface',
    tag:'Absolute contribution',
    note:'Each cell answers how much of the displayed Sheer Force currently comes from Rupture specialty.',
    verdict:'The arithmetic is easiest to verify, but the identical Combat value repeats information and changes the table from incremental disclosure to contribution accounting.',
    cells:['<span class="notation-value"><b>2,222.7</b></span>','<span class="notation-value"><b>2,222.7</b></span>','<span class="notation-value"><b>2,551.4</b></span>']
  },
  {
    id:'C',
    title:'Stable, then recalculated',
    tag:'State notation',
    recommended:true,
    note:'The amount is established once. Combat marks continuity; Fully enabled marks a fresh evaluation without presenting it as another addition.',
    verdict:'Separates <b>same</b>, <b>recalculated</b>, and <b>directly added</b> meanings while keeping one source row and little repeated text.',
    cells:['<span class="notation-value"><b>2,222.7</b></span>','<span class="notation-same">=</span>','<span class="notation-value notation-value--recalc"><em>↻</em><b>2,551.4</b></span>']
  },
  {
    id:'D',
    title:'Current amount with delta',
    tag:'Absolute + change',
    note:'Fully enabled exposes both the new formula output and how much it moved from Combat.',
    verdict:'Most explicit without opening another row, though showing <b>2,551.4</b> and <b>Δ +328.7</b> together adds visual density.',
    cells:['<span class="notation-value"><b>2,222.7</b></span>','<span class="notation-same">same</span>','<span class="notation-stack"><b>2,551.4</b><small>Δ +328.7</small></span>']
  },
  {
    id:'E',
    title:'Formula output emphasis',
    tag:'Input-aware output',
    note:'The cells frame the numbers as outputs of current ATK and current Max HP rather than ordinary modifier amounts.',
    verdict:'Makes the derived nature hardest to misunderstand, but repeating the input labels consumes space that the source detail already explains.',
    cells:['<span class="notation-inputs"><small>ATK + MAX HP</small><b>2,222.7</b></span>','<span class="notation-same">unchanged</span>','<span class="notation-inputs"><small>ATK + MAX HP</small><b>2,551.4</b></span>']
  }
];
var ruptureRoot=document.getElementById('rupture-variants');
ruptureRoot.innerHTML=ruptureVariants.map(function(variant){
  return '<section class="variant-sample">'+
    '<header class="selected-heading variant-heading" data-recommended="'+String(Boolean(variant.recommended))+'">'+
      '<span class="selected-index">'+variant.id+'</span>'+
      '<div><h2>'+variant.title+'</h2><p>'+variant.note+'</p></div>'+
      '<small>'+variant.tag+'</small>'+
    '</header>'+
    '<div class="result-frame variant-frame"><section class="result-panel">'+
      '<header class="panel-heading result-heading"><div><span class="eyebrow">RESULT // LIVE</span><h2>Yixuan Result</h2></div></header>'+
      '<article class="agent-result"><div class="result-table-wrap"><table>'+
        '<thead><tr><th>Quantity</th><th>Initial</th><th>Combat</th><th>Fully enabled</th></tr></thead>'+
        '<tbody><tr class="is-expanded"><th><span class="metric-label">Sheer Force</span></th><td>2,222.7</td><td>2,222.7</td><td>3,366.2</td></tr>'+
        '<tr class="breakdown-row"><td colspan="4"><div class="breakdown-grid"><div class="source-matrix-wrap"><table class="source-matrix">'+
          '<thead><tr><th>Source</th><th>Initial</th><th>Combat</th><th>Fully enabled</th></tr></thead><tbody>'+
          '<tr class="source-link source-tone--agent-yixuan"><th><i></i><span class="source-copy"><span>Rupture specialty</span><small>Current ATK × 0.3 + Current Max HP × 0.1</small></span></th><td>'+variant.cells[0]+'</td><td>'+variant.cells[1]+'</td><td>'+variant.cells[2]+'</td></tr>'+
          '<tr class="source-link source-tone--agent-lucia"><th><i></i><span class="source-copy"><span>Lucia · EX Special Attack</span></span></th><td></td><td></td><td><b>+814.8</b></td></tr>'+
          '</tbody></table></div></div></td></tr></tbody>'+
      '</table></div></article>'+
    '</section></div>'+
    '<p class="variant-verdict">'+variant.verdict+'</p>'+
  '</section>';
}).join('');

</script>
</body>
</html>
