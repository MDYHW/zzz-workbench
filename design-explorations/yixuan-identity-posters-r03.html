<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yixuan Identity Posters - Round 03</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: "DM Mono", monospace;
        background: #0b0c0d;
        color: #f0ede5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 0;
        margin: 0;
      }

      body {
        background:
          linear-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.032) 1px, transparent 1px),
          #0b0c0d;
        background-size: 28px 28px;
      }

      .page {
        width: min(1500px, 100%);
        margin: 0 auto;
        padding: 42px clamp(16px, 4vw, 64px) 72px;
      }

      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 28px;
        margin-bottom: 28px;
        border-bottom: 1px solid #383b3d;
        padding-bottom: 17px;
      }

      .intro h1 {
        margin: 0;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(46px, 7.5vw, 98px);
        font-weight: 800;
        line-height: 0.82;
        letter-spacing: -0.035em;
        text-transform: uppercase;
      }

      .intro p {
        max-width: 50ch;
        margin: 0;
        color: #a8adaf;
        font-size: 10px;
        line-height: 1.65;
        text-align: right;
        text-transform: uppercase;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(24px, 3vw, 42px);
      }

      figure {
        min-width: 0;
        margin: 0;
      }

      figure:last-child {
        grid-column: 1 / -1;
        width: calc(50% - clamp(12px, 1.5vw, 21px));
        justify-self: center;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding-top: 9px;
        color: #92979a;
        font-size: 9px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      figcaption b {
        color: #f0ede5;
        font-weight: 500;
      }

      .poster {
        position: relative;
        isolation: isolate;
        width: 100%;
        aspect-ratio: 2 / 1;
        overflow: hidden;
        opacity: 0;
        transform: translateY(9px);
        animation: reveal 430ms ease forwards;
      }

      figure:nth-child(2) .poster {
        animation-delay: 60ms;
      }

      figure:nth-child(3) .poster {
        animation-delay: 120ms;
      }

      figure:nth-child(4) .poster {
        animation-delay: 180ms;
      }

      figure:nth-child(5) .poster {
        animation-delay: 240ms;
      }

      .poster img {
        position: absolute;
        display: block;
        pointer-events: none;
        user-select: none;
        transition: transform 360ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .poster:hover img {
        transform: translate3d(0, -1%, 0) scale(1.02);
      }

      .display {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        line-height: 0.76;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }

      .micro {
        font-size: clamp(6px, 0.72vw, 9px);
        line-height: 1.35;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .fact-label {
        display: block;
        margin-bottom: 2px;
        opacity: 0.68;
        font-size: 0.76em;
      }

      .fact-value {
        display: block;
        font-weight: 500;
      }

      .noise {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        background:
          radial-gradient(circle, rgba(0, 0, 0, 0.13) 0 0.55px, transparent 0.75px),
          repeating-linear-gradient(0deg, transparent 0 4px, rgba(0, 0, 0, 0.035) 4px 5px);
        background-size: 5px 5px, auto;
        mix-blend-mode: multiply;
      }

      /* 01: contact matrix */
      .n01 {
        color: #c9e3de;
        background: #0d3034;
      }

      .n01::before {
        content: "YIXUAN";
        position: absolute;
        left: 3%;
        bottom: -7%;
        z-index: 1;
        color: rgba(201, 227, 222, 0.12);
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(116px, 18vw, 230px);
        font-weight: 800;
        line-height: 0.8;
        letter-spacing: -0.06em;
      }

      .n01 .strip {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 3;
        overflow: hidden;
        border-left: 3px solid #0d3034;
        background: #c9e3de;
      }

      .n01 .strip-a {
        left: 43%;
        width: 16%;
      }

      .n01 .strip-b {
        left: 59%;
        width: 19%;
      }

      .n01 .strip-c {
        left: 78%;
        width: 22%;
      }

      .n01 .strip img {
        top: -10%;
        height: 172%;
        width: 310%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.24);
      }

      .n01 .strip-a img {
        left: -121%;
      }

      .n01 .strip-b img {
        left: -108%;
      }

      .n01 .strip-c img {
        left: -83%;
      }

      .n01 .coral-key {
        position: absolute;
        left: 57.5%;
        top: 0;
        bottom: 0;
        z-index: 5;
        width: 2.5%;
        background: #ff5038;
      }

      .n01 .name {
        position: absolute;
        left: 4%;
        top: 10%;
        z-index: 6;
        width: 37%;
        font-size: clamp(58px, 8.2vw, 110px);
      }

      .n01 .rank {
        position: absolute;
        left: 4%;
        bottom: 8%;
        z-index: 6;
        border: 1px solid #ff5038;
        padding: 4px 7px;
        color: #ff5038;
      }

      .n01 .facts {
        position: absolute;
        left: 18%;
        bottom: 8%;
        z-index: 6;
        display: flex;
        gap: 14px;
      }

      /* 02: type reservoir */
      .n02 {
        color: #171615;
        background: #ece7da;
      }

      .n02::before {
        content: "YIXUAN YIXUAN";
        position: absolute;
        left: -2%;
        top: -13%;
        z-index: 1;
        width: 106%;
        color: #171615;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(82px, 12.8vw, 166px);
        font-weight: 800;
        line-height: 0.77;
        letter-spacing: -0.045em;
        word-spacing: 0.12em;
      }

      .n02::after {
        content: "YIXUAN";
        position: absolute;
        left: 17%;
        bottom: -13%;
        z-index: 1;
        color: #171615;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(92px, 14vw, 184px);
        font-weight: 800;
        line-height: 0.8;
        letter-spacing: -0.05em;
      }

      .n02 .accent-window {
        position: absolute;
        right: 24%;
        top: 20%;
        z-index: 2;
        width: 27%;
        height: 54%;
        background: #d9f118;
      }

      .n02 img {
        right: 5%;
        bottom: -91%;
        z-index: 3;
        width: 58%;
        height: 212%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.3);
        mix-blend-mode: multiply;
      }

      .n02 .rank {
        position: absolute;
        left: -2%;
        bottom: -23%;
        z-index: 4;
        color: #d9f118;
        font-size: clamp(150px, 22vw, 270px);
        -webkit-text-stroke: 2px #171615;
      }

      .n02 .facts {
        position: absolute;
        right: 4%;
        top: 7%;
        z-index: 6;
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 5px;
      }

      .n02 .fact {
        padding: 5px 7px;
        color: #ece7da;
        background: #171615;
      }

      /* 03: registration wall */
      .n03 {
        color: #181818;
        background: #d8d8d0;
      }

      .n03::before {
        content: "YIXUAN";
        position: absolute;
        left: 4%;
        top: 4%;
        z-index: 1;
        color: #181818;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(104px, 15.5vw, 204px);
        font-weight: 800;
        line-height: 0.8;
        letter-spacing: -0.055em;
      }

      .n03::after {
        content: "013 / AGENT ID / NEW ERIDU";
        position: absolute;
        left: 4%;
        right: 4%;
        bottom: 5%;
        z-index: 6;
        border-top: 1px solid #181818;
        padding-top: 5px;
        font-size: clamp(6px, 0.7vw, 9px);
        letter-spacing: 0.12em;
      }

      .n03 .portrait {
        right: 7%;
        bottom: -92%;
        z-index: 4;
        width: 57%;
        height: 215%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.45);
      }

      .n03 .ghost-cyan {
        right: 9%;
        bottom: -91%;
        z-index: 2;
        width: 57%;
        height: 215%;
        object-fit: contain;
        opacity: 0.38;
        filter: grayscale(1) sepia(1) saturate(5) hue-rotate(125deg) contrast(1.5);
        mix-blend-mode: multiply;
      }

      .n03 .ghost-pink {
        right: 5%;
        bottom: -93%;
        z-index: 3;
        width: 57%;
        height: 215%;
        object-fit: contain;
        opacity: 0.42;
        filter: grayscale(1) sepia(1) saturate(7) hue-rotate(285deg) contrast(1.5);
        mix-blend-mode: multiply;
      }

      .n03 .rank {
        position: absolute;
        left: 4%;
        top: 46%;
        z-index: 6;
        padding: 4px 7px;
        color: #d8d8d0;
        background: #181818;
      }

      .n03 .facts {
        position: absolute;
        left: 4%;
        top: 62%;
        z-index: 6;
        display: grid;
        grid-template-columns: auto auto;
        gap: 6px;
      }

      .n03 .fact:first-child {
        border-left: 7px solid #00a7a7;
        padding-left: 7px;
      }

      .n03 .fact:last-child {
        border-left: 7px solid #e63271;
        padding-left: 7px;
      }

      /* 04: segmented foldout */
      .n04 {
        color: #f3e9d3;
        background: #0e3a3a;
      }

      .n04::before {
        content: "";
        position: absolute;
        inset: 0 54% 0 0;
        z-index: 1;
        background: #d95a25;
      }

      .n04::after {
        content: "";
        position: absolute;
        inset: 0 31% 0 46%;
        z-index: 1;
        background: #f3e9d3;
      }

      .n04 .portrait {
        right: 0;
        bottom: -84%;
        z-index: 3;
        width: 66%;
        height: 204%;
        object-fit: contain;
      }

      .n04 .slice {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 4;
        overflow: hidden;
      }

      .n04 .slice-a {
        left: 42%;
        width: 13%;
      }

      .n04 .slice-b {
        left: 57%;
        width: 12%;
      }

      .n04 .slice img {
        bottom: -84%;
        width: 510%;
        height: 204%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.28);
      }

      .n04 .slice-a img {
        left: -264%;
      }

      .n04 .slice-b img {
        left: -324%;
      }

      .n04 .name {
        position: absolute;
        left: 4%;
        top: 8%;
        z-index: 6;
        width: 43%;
        font-size: clamp(62px, 9vw, 122px);
      }

      .n04 .rank {
        position: absolute;
        left: 4%;
        bottom: 8%;
        z-index: 6;
        color: #0e3a3a;
        background: #f3e9d3;
        padding: 4px 7px;
      }

      .n04 .facts {
        position: absolute;
        right: 3%;
        bottom: 6%;
        z-index: 6;
        width: 25%;
        display: grid;
        gap: 5px;
        border-left: 4px solid #f3e9d3;
        padding: 7px 8px;
        background: #0e3a3a;
      }

      .n04 .fact {
        border-bottom: 1px solid currentColor;
        padding: 3px 0 5px;
      }

      /* 05: extreme crop broadcast */
      .n05 {
        color: #ebe7dd;
        background: #141414;
      }

      .n05::before {
        content: "";
        position: absolute;
        inset: 0 41% 0 0;
        z-index: 1;
        background: #ebe7dd;
      }

      .n05::after {
        content: "YIXUAN";
        position: absolute;
        right: -5%;
        bottom: -7%;
        z-index: 1;
        color: transparent;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(100px, 15.5vw, 202px);
        font-weight: 800;
        line-height: 0.8;
        letter-spacing: -0.055em;
        -webkit-text-stroke: 2px #ebe7dd;
      }

      .n05 .portrait {
        left: -12%;
        bottom: -119%;
        z-index: 3;
        width: 79%;
        height: 244%;
        object-fit: contain;
        filter: grayscale(1) contrast(1.28);
        mix-blend-mode: multiply;
      }

      .n05 .mini {
        right: 5%;
        top: -10%;
        z-index: 2;
        width: 24%;
        height: 132%;
        object-fit: contain;
        opacity: 0.22;
        filter: grayscale(1) contrast(1.5);
      }

      .n05 .name {
        position: absolute;
        left: 4%;
        bottom: 7%;
        z-index: 6;
        color: #141414;
        font-size: clamp(56px, 8vw, 108px);
      }

      .n05 .rank {
        position: absolute;
        left: 4%;
        top: 7%;
        z-index: 6;
        padding: 5px 7px;
        color: #141414;
        background: #d1a833;
      }

      .n05 .facts {
        position: absolute;
        right: 4%;
        top: 8%;
        z-index: 6;
        width: 34%;
        display: grid;
        gap: 7px;
      }

      .n05 .fact {
        padding: 5px 7px;
        color: #141414;
        background: #ebe7dd;
      }

      .n05 .gold-key {
        position: absolute;
        right: 0;
        top: 0;
        z-index: 5;
        width: 2%;
        height: 100%;
        background: #d1a833;
      }

      @keyframes reveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 820px) {
        .intro {
          display: grid;
        }

        .intro p {
          text-align: left;
        }

        .gallery {
          grid-template-columns: 1fr;
        }

        figure:last-child {
          grid-column: auto;
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .poster {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .poster img {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Identity reset<br />five structures</h1>
        <p>
          No slashes, caution bands, records, taped sheets, or bridged titles.
          The five systems begin again from image-type collision and urban media.
        </p>
      </header>

      <section class="gallery" aria-label="Five reset Yixuan identity poster variants">
        <figure>
          <article class="poster n01" aria-label="Variant 1, contact matrix">
            <div class="strip strip-a"><img src="assets/yixuan-portrait.png" alt="" /></div>
            <div class="strip strip-b"><img src="assets/yixuan-portrait.png" alt="" /></div>
            <div class="strip strip-c"><img src="assets/yixuan-portrait.png" alt="" /></div>
            <div class="coral-key"></div>
            <div class="name display">Yixuan</div>
            <div class="rank micro">S-Rank</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
          </article>
          <figcaption><b>01 Contact matrix</b><span>Repeated crop / narrow accent</span></figcaption>
        </figure>

        <figure>
          <article class="poster n02" aria-label="Variant 2, type reservoir">
            <div class="accent-window"></div>
            <img src="assets/yixuan-portrait.png" alt="" />
            <div class="rank display">S</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Rank</span>
                <span class="fact-value">S-Rank</span>
              </div>
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
            <div class="noise"></div>
          </article>
          <figcaption><b>02 Type reservoir</b><span>Typography field / image breach</span></figcaption>
        </figure>

        <figure>
          <article class="poster n03" aria-label="Variant 3, registration wall">
            <img class="ghost-cyan" src="assets/yixuan-portrait.png" alt="" />
            <img class="ghost-pink" src="assets/yixuan-portrait.png" alt="" />
            <img class="portrait" src="assets/yixuan-portrait.png" alt="" />
            <div class="rank micro">S-Rank</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
            <div class="noise"></div>
          </article>
          <figcaption><b>03 Registration wall</b><span>Print offset / overprint</span></figcaption>
        </figure>

        <figure>
          <article class="poster n04" aria-label="Variant 4, segmented foldout">
            <img class="portrait" src="assets/yixuan-portrait.png" alt="" />
            <div class="slice slice-a"><img src="assets/yixuan-portrait.png" alt="" /></div>
            <div class="slice slice-b"><img src="assets/yixuan-portrait.png" alt="" /></div>
            <div class="name display">Yixuan</div>
            <div class="rank micro">S-Rank</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
          </article>
          <figcaption><b>04 Segmented foldout</b><span>Panel mismatch / crossing image</span></figcaption>
        </figure>

        <figure>
          <article class="poster n05" aria-label="Variant 5, extreme crop broadcast">
            <img class="portrait" src="assets/yixuan-portrait.png" alt="" />
            <img class="mini" src="assets/yixuan-portrait.png" alt="" />
            <div class="gold-key"></div>
            <div class="name display">Yixuan</div>
            <div class="rank micro">S-Rank</div>
            <div class="facts micro">
              <div class="fact">
                <span class="fact-label">Attribute</span>
                <span class="fact-value">Auric Ink</span>
              </div>
              <div class="fact">
                <span class="fact-label">Specialty</span>
                <span class="fact-value">Rupture</span>
              </div>
            </div>
          </article>
          <figcaption><b>05 Extreme crop</b><span>Scale clash / outlined echo</span></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
